<svg xmlns="http://www.w3.org/2000/svg" width="690" height="734" viewBox="0 0 690 734" role="img">
<title>windscape workflow</title>
<desc>How windscape objects and functions connect: wind data become a wind series, which yields wind fields and a wind rose. The wind rose feeds two families of connectivity models, least-cost and random walk, each with functions for paths, windshed maps, and pairwise matrices. ggplot2 layers draw each object.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="690" height="734" fill="white"/>
<rect x="40" y="30" width="220" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text x="150.0" y="48" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#444441" text-anchor="middle" dominant-baseline="central">Wind data</text>
<text x="150.0" y="68" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">ncar_download() or your own</text>
<rect x="430" y="30" width="240" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="550.0" y="48" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#085041" text-anchor="middle" dominant-baseline="central">wind_series</text>
<text x="550.0" y="68" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">time series of wind fields</text>
<path d="M260 58 L428 58" fill="none" stroke="#73726C" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="345.0" y="46" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">wind_series()</text>
<path d="M95 86 L95 156" fill="none" stroke="#73726C" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="103" y="122" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">wind_field()</text>
<path d="M495 86 L495 120 L205 120 L205 156" fill="none" stroke="#73726C" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="350" y="108" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">wind_field(), mean()</text>
<path d="M605 86 L605 156" fill="none" stroke="#73726C" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="597" y="122" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5F5E5A" text-anchor="end" dominant-baseline="central">wind_rose()</text>
<rect x="40" y="158" width="220" height="118" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="150.0" y="176" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#085041" text-anchor="middle" dominant-baseline="central">wind_field</text>
<text x="150.0" y="196" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">wind at one moment</text>
