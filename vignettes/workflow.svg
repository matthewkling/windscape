<path d="M205 612 L205 650" fill="none" stroke="#73726C" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="40" y="652" width="220" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text x="150.0" y="670" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#444441" text-anchor="middle" dominant-baseline="central">Hypothesis tests</text>
<text x="150.0" y="690" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">pairwise_ratios(), mantel_test()</text>
