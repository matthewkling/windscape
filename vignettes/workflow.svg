<text x="150.0" y="373" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3C3489" text-anchor="middle" dominant-baseline="central">geom_wind_arrow()</text>
<rect x="82.5" y="390" width="135" height="22" rx="11" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text x="150.0" y="401" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3C3489" text-anchor="middle" dominant-baseline="central">geom_wind_trail()</text>
<rect x="430" y="306" width="240" height="90" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="550.0" y="324" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#085041" text-anchor="middle" dominant-baseline="central">wind_rose</text>
<text x="550.0" y="344" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">conductance to neighbors</text>
<rect x="487.5" y="362" width="125" height="22" rx="11" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text x="550.0" y="373" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3C3489" text-anchor="middle" dominant-baseline="central">geom_wind_rose()</text>
<path d="M430 351 L262 351" fill="none" stroke="#73726C" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="345.0" y="339" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">net_flow()</text>
<text x="345.0" y="364" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">random_walk()$flux</text>
<rect x="300" y="464" width="370" height="296" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.75"/>
<path d="M605 396 L605 462" fill="none" stroke="#73726C" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="485.0" y="482" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0C447C" text-anchor="middle" dominant-baseline="central">Connectivity models</text>
<text x="395" y="508" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#0C447C" text-anchor="middle" dominant-baseline="central">least-cost</text>
<text x="395" y="524" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#185FA5" text-anchor="middle" dominant-baseline="central">fastest route</text>
<text x="580" y="508" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#0C447C" text-anchor="middle" dominant-baseline="central">random walk</text>
<text x="580" y="524" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#185FA5" text-anchor="middle" dominant-baseline="central">all routes</text>
<line x1="487" y1="498" x2="487" y2="748" stroke="#B5D4F4" stroke-width="1"/>
<text x="395" y="568" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#0C447C" text-anchor="middle" dominant-baseline="central">least_cost_paths()</text>
<text x="580" y="568" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#0C447C" text-anchor="middle" dominant-baseline="central">random_walk_paths()</text>
<path d="M300 568 L262 568" fill="none" stroke="#73726C" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="395" y="656" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#0C447C" text-anchor="middle" dominant-baseline="central">least_cost()</text>
<text x="580" y="656" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#0C447C" text-anchor="middle" dominant-baseline="central">random_walk()</text>
<path d="M300 656 L262 656" fill="none" stroke="#73726C" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="395" y="732" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#0C447C" text-anchor="middle" dominant-baseline="central">pairwise_least_cost()</text>
<text x="580" y="732" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#0C447C" text-anchor="middle" dominant-baseline="central">pairwise_random_walk()</text>
<path d="M300 732 L262 732" fill="none" stroke="#73726C" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="40" y="528" width="220" height="80" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
