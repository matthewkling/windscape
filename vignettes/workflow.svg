<rect x="82.5" y="578" width="135" height="22" rx="11" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text x="150.0" y="589" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3C3489" text-anchor="middle" dominant-baseline="central">geom_wind_path()</text>
<rect x="40" y="628" width="220" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text x="150.0" y="646" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#444441" text-anchor="middle" dominant-baseline="central">Windshed maps</text>
<text x="150.0" y="666" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">rasters of travel time, deposition</text>
<rect x="40" y="704" width="220" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text x="150.0" y="722" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#444441" text-anchor="middle" dominant-baseline="central">Pairwise matrices</text>
<text x="150.0" y="742" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">connectivity among sites</text>
<path d="M95 424 L95 526" fill="none" stroke="#73726C" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="103" y="478" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">wind_trails()</text>
<path d="M95 760 L95 798" fill="none" stroke="#73726C" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="103" y="779" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">mantel_test(), pairwise_ratios()</text>
<rect x="40" y="800" width="220" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text x="150.0" y="818" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#444441" text-anchor="middle" dominant-baseline="central">Hypothesis tests</text>
<text x="150.0" y="838" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">wind vs. ecological data</text>
