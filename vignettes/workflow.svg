<text x="150.0" y="253" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3C3489" text-anchor="middle" dominant-baseline="central">geom_wind_trail()</text>
<rect x="430" y="158" width="240" height="90" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="550.0" y="176" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#085041" text-anchor="middle" dominant-baseline="central">wind_rose</text>
