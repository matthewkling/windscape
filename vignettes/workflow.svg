<text x="345.0" y="216" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">random_walk()$flux</text>
<rect x="300" y="316" width="370" height="296" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.75"/>
<path d="M605 248 L605 314" fill="none" stroke="#73726C" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="485.0" y="334" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0C447C" text-anchor="middle" dominant-baseline="central">Connectivity models</text>
<text x="395" y="360" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#0C447C" text-anchor="middle" dominant-baseline="central">least-cost</text>
<text x="395" y="376" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#185FA5" text-anchor="middle" dominant-baseline="central">fastest route</text>
<text x="580" y="360" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#0C447C" text-anchor="middle" dominant-baseline="central">random walk</text>
<text x="580" y="376" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#185FA5" text-anchor="middle" dominant-baseline="central">all routes</text>
<line x1="487" y1="350" x2="487" y2="600" stroke="#B5D4F4" stroke-width="1"/>
