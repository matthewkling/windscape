<text x="580" y="420" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#0C447C" text-anchor="middle" dominant-baseline="central">random_walk_paths()</text>
<path d="M300 420 L262 420" fill="none" stroke="#73726C" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="395" y="508" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#0C447C" text-anchor="middle" dominant-baseline="central">least_cost()</text>
<text x="580" y="508" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#0C447C" text-anchor="middle" dominant-baseline="central">random_walk()</text>
<path d="M300 508 L262 508" fill="none" stroke="#73726C" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="395" y="584" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#0C447C" text-anchor="middle" dominant-baseline="central">pairwise_least_cost()</text>
<text x="580" y="584" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#0C447C" text-anchor="middle" dominant-baseline="central">pairwise_random_walk()</text>
<path d="M300 584 L262 584" fill="none" stroke="#73726C" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="40" y="380" width="220" height="80" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text x="150.0" y="398" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#444441" text-anchor="middle" dominant-baseline="central">Path data</text>
<text x="150.0" y="418" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">trails and routes</text>
<rect x="82.5" y="430" width="135" height="22" rx="11" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text x="150.0" y="441" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3C3489" text-anchor="middle" dominant-baseline="central">geom_wind_path()</text>
<rect x="40" y="480" width="220" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
